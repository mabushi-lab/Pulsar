[env:lilygo-t-displays3]
platform  = espressif32@6.5.0
board     = lilygo-t-display-s3
framework = arduino

upload_speed  = 115200
monitor_speed = 115200
upload_flags  = --before=no_reset

; ── Flashing over Wi-Fi ───────────────────────────────────────────────────────
; The device runs an OTA listener, so after the first USB flash you can push
; firmware over the network:
;
;   pio run -t upload --upload-port pulsar.local
;
; Uncomment the two lines below to make that the default and stop needing the
; cable at all. Set OTA_PASSWORD in include/secrets.h first, and pass it here as
; --auth=... — without one, anyone on your network can reflash the device.
;
; upload_protocol = espota
; upload_port     = pulsar.local
; upload_flags    = --auth=YourOtaPassword

lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    bblanchon/ArduinoJson@^7.0.0

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
