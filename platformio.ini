[platformio]
; A bare `pio run` builds the USB environment only; the OTA one is opt-in.
default_envs = lilygo-t-displays3

[env:lilygo-t-displays3]
platform  = espressif32@6.5.0
board     = lilygo-t-display-s3
framework = arduino

upload_speed  = 115200
monitor_speed = 115200
upload_flags  = --before=no_reset

lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    bblanchon/ArduinoJson@^7.0.0

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; ── Flashing over Wi-Fi ───────────────────────────────────────────────────────
; After the first USB flash the device listens for firmware pushes, so the
; cable is only needed once:
;
;   PULSAR_OTA_PASSWORD=yourpassword pio run -e ota -t upload
;
; A separate environment rather than commented-out lines, so USB uploads keep
; working untouched and nothing has to be edited before each push. The password
; comes from the environment because platformio.ini IS committed - putting it
; here would undo the point of keeping it in the gitignored secrets.h.
;
; If pulsar.local does not resolve, use the device's IP instead; it is on the
; boot screen and on the web dashboard.
[env:ota]
extends         = env:lilygo-t-displays3
upload_protocol = espota
upload_port     = pulsar.local
upload_flags    = --auth=${sysenv.PULSAR_OTA_PASSWORD}
